version: "3.9"

services:
  db:
    image: postgres:16
    container_name: acesso-remoto-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: acesso_remoto
      POSTGRES_PASSWORD: acesso_remoto
      POSTGRES_DB: acesso_remoto_industrial
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build: ./backend
    container_name: acesso-remoto-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql://acesso_remoto:acesso_remoto@db:5432/acesso_remoto_industrial
    ports:
      - "8000:8000"
    depends_on:
      - db

volumes:
  pgdata:
